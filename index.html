<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องคิดเลขแบ่งเงินลง แดง/น้ำเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ee; --surface:#ffffff; --ink:#1d1b1a; --muted:#6b6560; --line:#ded9d3;
  --red:#c8322b; --red-soft:#fbe6e4; --blue:#2358b8; --blue-soft:#e3ebfa;
  --ok:#1c7a4a; --warn:#a3560c; --warn-soft:#fdf0dc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1f1d1c; --ink:#f1eeea; --muted:#a39d96; --line:#35312e;
    --red:#ff6b62; --red-soft:#3a1d1b; --blue:#7aa2ff; --blue-soft:#18233f;
    --ok:#5fd596; --warn:#f0a553; --warn-soft:#3a2a14;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1f1d1c; --ink:#f1eeea; --muted:#a39d96; --line:#35312e;
  --red:#ff6b62; --red-soft:#3a1d1b; --blue:#7aa2ff; --blue-soft:#18233f;
  --ok:#5fd596; --warn:#f0a553; --warn-soft:#3a2a14;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;line-height:1.3;margin:4px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.field{margin-bottom:14px}
label.t{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=text]{width:100%;font:inherit;font-size:20px;font-weight:600;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side{border-radius:14px;padding:12px 14px 14px;margin-bottom:14px}
.side.red{background:var(--red-soft);border-left:6px solid var(--red)}
.side.blue{background:var(--blue-soft);border-left:6px solid var(--blue)}
.side .name{font-weight:800;margin-bottom:8px}
.red .name{color:var(--red)} .blue .name{color:var(--blue)}
.sign{flex:0 0 auto;width:56px;font:inherit;font-size:22px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.result{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:12px;padding:12px}
.box.red{background:var(--red-soft)} .box.blue{background:var(--blue-soft)}
.box small{display:block;font-size:13px;color:var(--muted)}
.box b{display:block;font-size:26px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.box.red b{color:var(--red)} .box.blue b{color:var(--blue)}
.profit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.profit .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.profit .big.pos{color:var(--ok)} .profit .big.neg{color:var(--warn)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:6px 0;border-bottom:1px solid var(--line)} td:last-child{text-align:right;font-weight:600}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.foot{color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>แบ่งเงินลงแดง/น้ำเงิน</h1>
  <p class="sub">ใส่งบและค่าน้ำ ระบบจะหาว่าต้องลงฝั่งละกี่บาท เพื่อให้ได้กำไรเท่ากันไม่ว่าฝั่งไหนชนะ</p>

  <div class="field">
    <label class="t" for="total">งบทั้งหมด (บาท)</label>
    <input id="total" type="text" inputmode="decimal" placeholder="เช่น 4000" value="4000" autocomplete="off">
  </div>

  <div class="side red">
    <div class="name">ฝ่ายแดง</div>
    <div class="row">
      <button class="sign" id="sr" type="button" aria-label="สลับเครื่องหมายค่าน้ำฝ่ายแดง">−</button>
      <input id="r" type="text" inputmode="decimal" placeholder="เช่น 0.60" value="0.60" autocomplete="off" aria-label="ค่าน้ำฝ่ายแดง">
    </div>
  </div>

  <div class="side blue">
    <div class="name">ฝ่ายน้ำเงิน</div>
    <div class="row">
      <button class="sign" id="sb" type="button" aria-label="สลับเครื่องหมายค่าน้ำฝ่ายน้ำเงิน">−</button>
      <input id="b" type="text" inputmode="decimal" placeholder="เช่น 0.78" value="0.78" autocomplete="off" aria-label="ค่าน้ำฝ่ายน้ำเงิน">
    </div>
  </div>
  <div class="hint">ค่าน้ำ −0.60 = ลง 0.60 ชนะได้กำไร 1 &nbsp;|&nbsp; ค่าน้ำ +0.80 = ลง 1 ชนะได้กำไร 0.80 (กดปุ่มเพื่อสลับ − / +)</div>

  <section class="result" id="out" aria-live="polite"></section>
  <p class="foot">แพ้เสียเงินที่ลงทั้งหมดของฝั่งนั้น ผลคำนวณเป็นตัวเลขประมาณการเท่านั้น</p>
</main>
<script>
(function(){
  var neg={r:true,b:true};
  var $=function(id){return document.getElementById(id)};
  function num(s){var v=parseFloat(String(s).replace(/,/g,'').trim());return isFinite(v)?Math.abs(v):NaN}
  function fmt(x,d){return x.toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d})}
  // profit per 1 baht staked
  function gain(v,isNeg){return isNeg?1/v:v}
  function calc(){
    var T=num($('total').value),a=num($('r').value),c=num($('b').value),out=$('out');
    if(!(T>0)||!(a>0)||!(c>0)){out.innerHTML='<div class="empty">กรอกงบและค่าน้ำทั้งสองฝั่งให้ครบ (ต้องมากกว่า 0)</div>';return}
    var r=gain(a,neg.r),s=gain(c,neg.b);
    var R=T*(1+s)/(2+r+s), B=T-R;
    var Rr=Math.round(R), Br=Math.round(B);
    var pRed=Rr*r-Br, pBlue=Br*s-Rr;
    var worst=Math.min(pRed,pBlue);
    var exact=T*(r*s-1)/(2+r+s);
    var good=worst>0;
    var h='<div class="split">'+
      '<div class="box red"><small>ลงแดง</small><b>'+fmt(Rr,0)+'</b></div>'+
      '<div class="box blue"><small>ลงน้ำเงิน</small><b>'+fmt(Br,0)+'</b></div></div>'+
      '<div class="profit"><small style="color:var(--muted)">'+(good?'กำไรแน่นอนต่ำสุด':'ผลลัพธ์ต่ำสุด (ขาดทุน)')+'</small>'+
      '<div class="big '+(good?'pos':'neg')+'">'+(worst>=0?'+':'−')+fmt(Math.abs(worst),0)+' บาท</div>'+
      '<table><tr><td>ถ้าแดงชนะ</td><td>'+(pRed>=0?'+':'−')+fmt(Math.abs(pRed),0)+'</td></tr>'+
      '<tr><td>ถ้าน้ำเงินชนะ</td><td>'+(pBlue>=0?'+':'−')+fmt(Math.abs(pBlue),0)+'</td></tr>'+
      '<tr><td>คิดเป็นของงบ</td><td>'+fmt(exact/T*100,1)+'%</td></tr></table></div>';
    if(!good){
      h+='<div class="warn">ค่าน้ำชุดนี้ไม่มีกำไรแน่นอน ต้องมี (กำไรต่อ 1 บาทฝั่งแดง × ฝั่งน้ำเงิน) มากกว่า 1 จึงจะล็อกกำไรได้ ตอนนี้เท่ากับ '+fmt(r*s,3)+' ตัวเลขข้างบนคือการแบ่งที่ขาดทุนน้อยที่สุดเท่ากันทั้งสองฝั่ง</div>';
    }
    out.innerHTML=h;
  }
  function flip(k,btn){neg[k]=!neg[k];btn.textContent=neg[k]?'\u2212':'+';calc()}
  $('sr').onclick=function(){flip('r',this)};
  $('sb').onclick=function(){flip('b',this)};
  ['total','r','b'].forEach(function(id){$(id).addEventListener('input',calc)});
  calc();
})();
</script>
</body>
</html>
